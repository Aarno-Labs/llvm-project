# lit.local.cfg
import sys
import lit.formats
from lit.llvm import llvm_config

config.test_format = lit.formats.ShTest(execute_external=True)

# Keep tool discovery (not strictly required after inlining, but harmless).
llvm_config.add_tool_substitutions(['clang', 'clang-refold'],
                   llvm_config.config.environment['PATH'])

# Resolve Python once; don't rely on %{python} (won't be re-expanded).
python_exe = getattr(config, 'python_executable', None) or sys.executable

# Try to resolve absolute clang path if LIT provided it; else fall back to 'clang'.
clang_path = getattr(config, 'clang', None) or 'clang'
# Try to resolve clang-refold; if not found, let PATH handle it at runtime.
try:
  clang_refold_path = llvm_config.which('clang-refold')
except Exception:
  clang_refold_path = 'clang-refold'

# Like %clang-refold-tester, but without --no-lines passed to clang-refold.
config.substitutions.append((
  '%clang-refold-tester-with-lines',
  f'{python_exe} %S/refold_tester.py'
  f' --with-lines'
  f' --clang {clang_path}'
  f' --refolder {clang_refold_path}'
  f' --headers %S/headers'
  f' --expected %S/expected'
  f' --log trace'
  f' --src %s'
  f' --tmp %t'
))

# Raw-producer-flags variants.  These MUST appear before the generic
# %clang-refold-tester substitution because lit substitutions are prefix-like:
# otherwise %clang-refold-tester-clang-flags is parsed as
# %clang-refold-tester plus a literal -clang-flags suffix attached to %t.
config.substitutions.append((
  '%clang-refold-tester-clang-flags-with-lines',
  f'{python_exe} %S/refold_tester.py'
  f' --with-lines'
  f' --clang-flags-mode'
  f' --clang {clang_path}'
  f' --refolder {clang_refold_path}'
  f' --headers %S/headers'
  f' --expected %S/expected'
  f' --log trace'
  f' --src %s'
  f' --tmp %t'
))

config.substitutions.append((
  '%clang-refold-tester-clang-flags',
  f'{python_exe} %S/refold_tester.py'
  f' --clang-flags-mode'
  f' --clang {clang_path}'
  f' --refolder {clang_refold_path}'
  f' --headers %S/headers'
  f' --expected %S/expected'
  f' --log trace'
  f' --src %s'
  f' --tmp %t'
))

# Relaxed driver with a NEGATIVE check assertion: the refold must match the
# expected .c.mod but the relaxed re-preprocess check must REJECT it.  Proves
# the relaxed stringify tolerance does not accept an independently edited
# stringified argument (only a provably stale one).  MUST precede
# %clang-refold-tester-relaxed (prefix-like matching).
config.substitutions.append((
  '%clang-refold-tester-relaxed-check-rejects',
  f'{python_exe} %S/refold_tester.py'
  f' --relaxed --expect-check-fail'
  f' --clang {clang_path}'
  f' --refolder {clang_refold_path}'
  f' --headers %S/headers'
  f' --expected %S/expected'
  f' --log trace'
  f' --src %s'
  f' --tmp %t'
))

# Relaxed (non-strict) driver.  Runs clang-refold WITHOUT --strict so the
# default, soundness-trading refold pipeline is exercised by regressions.
# MUST be registered before the generic %clang-refold-tester substitution
# (prefix-like matching), same as the -clang-flags variants above.
config.substitutions.append((
  '%clang-refold-tester-relaxed',
  f'{python_exe} %S/refold_tester.py'
  f' --relaxed'
  f' --clang {clang_path}'
  f' --refolder {clang_refold_path}'
  f' --headers %S/headers'
  f' --expected %S/expected'
  f' --log trace'
  f' --src %s'
  f' --tmp %t'
))

# One-stop driver for the whole refold test flow.
# NOTE: We inline %S/headers and %S/expected (no nested %headers/%expected),
# and we inline concrete tool paths (no nested %clang/%clang-refold).
# %s and %T *are* left as-is because LIT expands those on the first pass.
config.substitutions.append((
  '%clang-refold-tester',
  f'{python_exe} %S/refold_tester.py'
  f' --clang {clang_path}'
  f' --refolder {clang_refold_path}'
  f' --headers %S/headers'
  f' --expected %S/expected'
  f' --log trace'
  f' --src %s'
  f' --tmp %t'
))
